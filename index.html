    font-size:12px;

    text-align:center;

    font-size:12px;

</head>

let lang = 'en';
let idx = 0;
const STORAGE_KEY = 'kingdom_sisters_read_days';

function getReadSet(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}
function saveReadSet(set){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); }catch(e){}
}

function render(){
  const d = DEVOTIONALS[idx][lang];
  const ui = UI_TEXT[lang];

  document.getElementById('refLine').textContent = d.ref;
  document.getElementById('verseLine').textContent = d.verse;
  document.getElementById('titleLine').textContent = d.title;

  const bodyEl = document.getElementById('bodyLines');
  bodyEl.innerHTML = d.body.map(p => `<p>${p}</p>`).join('');

  document.getElementById('qTitle').textContent = ui.q;
  const qList = document.getElementById('questionsList');
  qList.innerHTML = d.questions.map((q,i) => `
    <div class="q"><div class="num">${i+1}</div><div>${q}</div></div>
  `).join('');

  document.getElementById('prevBtn').textContent = ui.prev;
  document.getElementById('nextBtn').textContent = ui.next;

  // install button label + iOS sheet text follow the current language
  if (!installBtn.hidden) {
    installBtn.textContent = isIOS ? ui.installIOS : ui.installAndroid;
  }
  document.getElementById('iosSheetTitle').textContent = ui.iosTitle;
  document.getElementById('iosStep1').innerHTML = ui.iosStep1;
  document.getElementById('iosStep2').innerHTML = ui.iosStep2;
  document.getElementById('iosStep3').innerHTML = ui.iosStep3;
  document.getElementById('iosClose').textContent = ui.iosClose;

  // dots
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = DEVOTIONALS.map((_,i) =>
    `<div class="dot ${i===idx?'active':''}" data-i="${i}"></div>`
  ).join('');
  dotsEl.querySelectorAll('.dot').forEach(el=>{
    el.addEventListener('click', ()=>{ idx = parseInt(el.dataset.i); render(); });
  });

  // read state
  const readSet = getReadSet();
  const key = DEVOTIONALS[idx].id;
  const markBtn = document.getElementById('markBtn');
  if(readSet.has(key)){
    markBtn.textContent = ui.done;
    markBtn.classList.add('done');
  } else {
    markBtn.textContent = ui.mark;
    markBtn.classList.remove('done');
  }
  document.getElementById('streakLabel').innerHTML = ui.streak(readSet.size);
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  idx = (idx - 1 + DEVOTIONALS.length) % DEVOTIONALS.length;
  render();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  idx = (idx + 1) % DEVOTIONALS.length;
  render();
});
document.getElementById('markBtn').addEventListener('click', ()=>{
  const readSet = getReadSet();
  const key = DEVOTIONALS[idx].id;
  if(readSet.has(key)) readSet.delete(key); else readSet.add(key);
  saveReadSet(readSet);
  render();
});
document.getElementById('langToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  lang = btn.dataset.lang;
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

// --- install support: set this up BEFORE the first render() call, ---
// --- since render() updates the install button's label each time  ---
const installBtn = document.getElementById('installBtn');
const iosOverlay = document.getElementById('iosOverlay');
const iosClose = document.getElementById('iosClose');

const isStandalone =
  window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true; // iOS Safari's own flag
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

let deferredInstallPrompt = null;

if (!isStandalone) {
  if (isIOS) {
    // iOS never fires beforeinstallprompt — show our own instructions instead
    installBtn.hidden = false;
    installBtn.addEventListener('click', () => { iosOverlay.hidden = false; });
    iosClose.addEventListener('click', () => { iosOverlay.hidden = true; });
    iosOverlay.addEventListener('click', (e) => { if (e.target === iosOverlay) iosOverlay.hidden = true; });
  } else {
    // Android / Chrome / Edge: native install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.hidden = true;
    });
    window.addEventListener('appinstalled', () => { installBtn.hidden = true; });
  }
}

// open on today's devotional (rotates through the set by day-of-year)
const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 86400000);
idx = dayOfYear % DEVOTIONALS.length;

render();

// register service worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
